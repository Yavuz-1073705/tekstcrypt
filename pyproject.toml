[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tekstcrypt"
version = "1.0.0"
description = "Tekst versleutelen en ontsleutelen met AES-256-GCM (CLI + GUI)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Yavuz" }]
dependencies = ["cryptography>=44"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tekstcrypt = "tekstcrypt.cli:main"

[tool.setuptools]
packages = ["tekstcrypt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
